steps:
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    env: [DOCKER_BUILDKIT=1]
    secretEnv: [HF_TOKEN]
    args: [-c, 'docker build --secret id=hf_token,env=HF_TOKEN --build-arg MUSCRIPTOR_MODEL=${_MUSCRIPTOR_MODEL} -f Dockerfile.jobs -t ${_IMAGE} .']
availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/${_HF_SECRET}/versions/latest
      env: HF_TOKEN
substitutions:
  _MUSCRIPTOR_MODEL: large
  _HF_SECRET: muscriptor-hf-token
images: ['${_IMAGE}']
timeout: 7200s
options:
  logging: CLOUD_LOGGING_ONLY
